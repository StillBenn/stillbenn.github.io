<body class="room-page">

<header class="room-bar">
  <a class="room-bar__brand" href="/">Bünyamin Katkat</a>
  <div class="lang" role="group" aria-label="Language">
    <button class="lang__btn" type="button" data-lang="tr" aria-pressed="true">TR</button>
    <button class="lang__btn" type="button" data-lang="en" aria-pressed="false">EN</button>
    <button class="lang__btn" type="button" data-lang="ru" aria-pressed="false">RU</button>
  </div>
</header>

<main class="room">

  <div class="room__view">
    <canvas class="stage" aria-label="3D interior"></canvas>
    <p class="room__hint" data-t="drag">Sürükleyerek çevirin</p>
  </div>

  <aside class="room__panel">
    <p class="room__kicker" data-t="kicker">İç mekân · malzeme konfigüratörü</p>

    <section class="opt">
      <h2 class="opt__h" data-t="floor">Zemin</h2>
      <div class="opt__row" id="opt-floor"></div>
    </section>

    <section class="opt">
      <h2 class="opt__h" data-t="counter">Tezgâh</h2>
      <div class="opt__row" id="opt-counter"></div>
    </section>

    <section class="opt">
      <h2 class="opt__h" data-t="front">Dolap kapağı</h2>
      <div class="opt__row" id="opt-front"></div>
    </section>

    <section class="opt">
      <h2 class="opt__h" data-t="wall">Duvar rengi</h2>
      <div class="opt__row" id="opt-wall"></div>
    </section>

    <section class="opt">
      <h2 class="opt__h" data-t="light">Işık</h2>
      <div class="opt__row opt__row--chips">
        <button class="chip" type="button" data-light="day" aria-pressed="true"><span data-t="day">Gündüz</span></button>
        <button class="chip" type="button" data-light="evening" aria-pressed="false"><span data-t="evening">Akşam</span></button>
        <button class="chip chip--ghost" type="button" id="reset"><span data-t="reset">Görünümü sıfırla</span></button>
      </div>
    </section>

    <section class="opt opt--summary">
      <h2 class="opt__h" data-t="summary">Seçilenler</h2>
      <p class="summary" id="summary"></p>
    </section>

    <p class="room__note" data-t="note"></p>
    <a class="room__cta" href="/#contact"><span data-t="cta">Bu işi kendi projeniz için isteyin</span></a>
